[project]
name = "geotif"
version = "0.1.0"
description = "Small collection of GeoTIFF tools: tile to .sqlitedb, merge, etc."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Petro Antonyshyn" }]
dependencies = [
    "numpy>=2.4.4",
    "pillow>=12.2.0",
    "rasterio>=1.5.0",
]

[project.scripts]
geotif = "geotif.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
